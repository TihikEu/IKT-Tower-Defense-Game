<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css" />
  <title>Tower Defense</title>
</head>

<body>
  <main class="bg-subtle-secondary min-vh-100">
    <div class="container min-vh-100 d-flex flex-column">
      <div class="screen_header row py-4 mx-auto bg-body w-100 flex-shrink-0">

        <div class="infos col col-lg-5 d-flex align-items-center gap-3 justify-content-start">

          <div class="elet_hud d-flex align-items-center gap-3 w-50">

            <div class="bg-1 rounded-2 p-5">

              <i class="bi bi-heart-fill fg-danger"></i>

            </div>

            <div class="elet_content d-flex flex-column align-items-start justify-content-center">

              <p class="m-0 text-uppercase fs-ms text fg-4">Elet</p>
              <p class="m-0"><span class="fs-lg text elet fg-danger"></span> / 15</p>

            </div>

          </div>

          <div class="elet_hud d-flex align-items-center gap-3 w-50">

            <div class="bg-1 rounded-2 p-5">

              <i class="bi bi-coin fg-emphasis-warning"></i>

            </div>

            <div class="elet_content d-flex flex-column align-items-start justify-content-center">

              <p class="m-0 text-uppercase fs-ms text fg-4">Penz</p>
              <p class="m-0"><span class="fs-lg text penz fg-emphasis-warning"></span></p>

            </div>

          </div>

        </div>

        <div class="hullam col col-lg-2 d-flex align-items-center justify-content-center">

          <p class="m-0 bg-1 rounded-2 py-3 px-5 wavver">Hullam <span class="wave"></span> / 5</p>
          <p class="m-0 bg-1 rounded-2 py-3 px-5 timer text-white"></p>
        </div>

        <div class="gombok col col-lg-5 align-items-center gap-3 justify-content-end d-flex">

          <button type="button" class="start btn m-0">Indítás</button>

          <button type="button" class="stop btn m-0">Megallit</button>

        </div>

      </div>

      <div class="screen_body position-relative flex-shrink-0">

        <div class="game_screen position-relative w-100"></div>

        <div class="towerInfos position-absolute z-3 w-25 d-flex flex-column gap-5 d-none"></div>

      </div>

      <div class="screen_footer py-4 mx-auto bg-body w-100 flex-grow-1 d-flex align-items-center justify-content-center">

        <p class="m-0">Zente</p>

      </div>

    </div>
  </main>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <script src="js/Enemy.js"></script>
  <script src="js/Torony.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
